name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYNCTHING_VERSION: "v2.1.5"
      SYNCTHING_COMMIT: "2ca95cf1498104113fdfde46df4107f2450a0f71"
      GO_VERSION: "1.27.1"
      NDK_VERSION: "30.0.16248370"
      MIN_ANDROID_API: "26"
      # Increment when the native build recipe changes outside the pinned inputs below.
      NATIVE_CACHE_SCHEMA: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore pinned native runtime cache
        id: native-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ runner.temp }}/syncthing-jni
            ${{ runner.temp }}/syncthing-commit.txt
          key: oclax-native-${{ runner.os }}-schema-${{ env.NATIVE_CACHE_SCHEMA }}-syncthing-${{ env.SYNCTHING_COMMIT }}-go-${{ env.GO_VERSION }}-ndk-${{ env.NDK_VERSION }}-api-${{ env.MIN_ANDROID_API }}

      - name: Set up Go
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Resolve pinned Android NDK
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          CLANG="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${MIN_ANDROID_API}-clang"

          if [ ! -x "${CLANG}" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit 2>/dev/null || true)"
            if [ -z "${SDKMANAGER}" ]; then
              echo "Android sdkmanager was not found under ANDROID_HOME/cmdline-tools."
              exit 1
            fi
            "${SDKMANAGER}" "ndk;${NDK_VERSION}"
          fi

          test -x "${CLANG}"
          echo "OCLAX_NDK_CC=${CLANG}" >> "${GITHUB_ENV}"

      - name: Fetch pinned Syncthing source
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${SYNCTHING_VERSION}" https://github.com/syncthing/syncthing.git "${RUNNER_TEMP}/syncthing"
          cd "${RUNNER_TEMP}/syncthing"
          git describe --tags --exact-match
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          test "${ACTUAL_COMMIT}" = "${SYNCTHING_COMMIT}"
          printf '%s\n' "${ACTUAL_COMMIT}" > "${RUNNER_TEMP}/syncthing-commit.txt"

      - name: Build Android runtimes
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/syncthing"

          export CGO_ENABLED=1
          export GO111MODULE=on
          export SOURCE_DATE_EPOCH=0
          export EXTRA_LDFLAGS="-checklinkname=0"

          OUTPUT_ROOT="${RUNNER_TEMP}/syncthing-jni"
          mkdir -p "${OUTPUT_ROOT}"

          build_target() {
            local goarch="$1"
            local abi="$2"
            local compiler="$3"
            local output_dir="${OUTPUT_ROOT}/${abi}"
            local output="${output_dir}/libsyncthingnative.so"

            mkdir -p "${output_dir}"
            go run build.go -goos android -goarch "${goarch}" -cc "${compiler}" -version "${SYNCTHING_VERSION}" -no-upgrade -build-out "${output}" build
            test -s "${output}"
            chmod 0755 "${output}"
            file "${output}"
            (cd "${output_dir}" && sha256sum libsyncthingnative.so > libsyncthingnative.so.sha256)
          }

          TOOLCHAIN="${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          build_target arm64 arm64-v8a "${TOOLCHAIN}/aarch64-linux-android${MIN_ANDROID_API}-clang"
          build_target arm armeabi-v7a "${TOOLCHAIN}/armv7a-linux-androideabi${MIN_ANDROID_API}-clang"
          build_target amd64 x86_64 "${TOOLCHAIN}/x86_64-linux-android${MIN_ANDROID_API}-clang"
          build_target 386 x86 "${TOOLCHAIN}/i686-linux-android${MIN_ANDROID_API}-clang"

      - name: Verify cached or built native runtimes
        shell: bash
        run: |
          set -euo pipefail

          test "$(cat "${RUNNER_TEMP}/syncthing-commit.txt")" = "${SYNCTHING_COMMIT}"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cd "${RUNNER_TEMP}/syncthing-jni/${abi}"
            test -s libsyncthingnative.so
            sha256sum --check libsyncthingnative.so.sha256
            file libsyncthingnative.so
          done

      - name: Upload native runtimes
        uses: actions/upload-artifact@v7
        with:
          name: syncthing-native-v2.1.5
          path: |
            ${{ runner.temp }}/syncthing-jni
            ${{ runner.temp }}/syncthing-commit.txt
          if-no-files-found: error
          retention-days: 14

  build:
    needs: native-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download native runtimes
        uses: actions/download-artifact@v8
        with:
          name: syncthing-native-v2.1.5
          path: "${{ runner.temp }}/syncthing-runtime"

      - name: Package native runtimes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="${RUNNER_TEMP}/syncthing-runtime/syncthing-jni"
          DEST_ROOT="${GITHUB_WORKSPACE}/app/src/main/jniLibs"

          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cd "${SOURCE_ROOT}/${abi}"
            sha256sum --check libsyncthingnative.so.sha256
            mkdir -p "${DEST_ROOT}/${abi}"
            install -m 0755 libsyncthingnative.so "${DEST_ROOT}/${abi}/libsyncthingnative.so"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Prepare stable test signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.OCLAX_TEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OCLAX_TEST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OCLAX_TEST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OCLAX_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo "Stable test signing secrets are not configured; using runner debug signing for this build."
            exit 0
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Stable test signing is partially configured. All four secrets are required."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oclax-test.jks"
          echo "OCLAX_TEST_KEYSTORE_FILE=$RUNNER_TEMP/oclax-test.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build (pull request)
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Test, lint and build (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          OCLAX_TEST_KEYSTORE_PASSWORD: ${{ secrets.OCLAX_TEST_KEYSTORE_PASSWORD }}
          OCLAX_TEST_KEY_ALIAS: ${{ secrets.OCLAX_TEST_KEY_ALIAS }}
          OCLAX_TEST_KEY_PASSWORD: ${{ secrets.OCLAX_TEST_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify APK contains runtimes
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "${APK}" | grep -F "lib/${abi}/libsyncthingnative.so"
          done

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: OclAx-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
