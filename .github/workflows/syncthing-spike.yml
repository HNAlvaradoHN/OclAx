name: Syncthing Native Spike

on:
  push:
    branches:
      - research/transfer-engine-prototype
    paths:
      - ".github/workflows/syncthing-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYNCTHING_VERSION: "v2.1.5"
      GO_VERSION: "1.27.1"
      NDK_VERSION: "30.0.16248370"
      MIN_ANDROID_API: "26"

    steps:
      - name: Checkout OclAx
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;${NDK_VERSION}"
          test -x "${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${MIN_ANDROID_API}-clang"

      - name: Fetch pinned Syncthing source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${SYNCTHING_VERSION}"             https://github.com/syncthing/syncthing.git             "${RUNNER_TEMP}/syncthing"
          cd "${RUNNER_TEMP}/syncthing"
          git describe --tags --exact-match
          git rev-parse HEAD | tee "${RUNNER_TEMP}/syncthing-commit.txt"

      - name: Build Android arm64 Syncthing core
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/syncthing"

          export CGO_ENABLED=1
          export GO111MODULE=on
          export SOURCE_DATE_EPOCH=0
          export EXTRA_LDFLAGS="-checklinkname=0"

          CC="${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${MIN_ANDROID_API}-clang"
          OUTPUT="${RUNNER_TEMP}/libsyncthingnative.so"

          go run build.go             -goos android             -goarch arm64             -cc "${CC}"             -version "${SYNCTHING_VERSION}"             -no-upgrade             -build-out "${OUTPUT}"             build

          test -s "${OUTPUT}"
          chmod 0755 "${OUTPUT}"
          file "${OUTPUT}"
          sha256sum "${OUTPUT}" | tee "${RUNNER_TEMP}/libsyncthingnative.so.sha256"

      - name: Upload isolated native spike artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncthing-native-arm64-v2.1.5
          path: |
            ${{ runner.temp }}/libsyncthingnative.so
            ${{ runner.temp }}/libsyncthingnative.so.sha256
            ${{ runner.temp }}/syncthing-commit.txt
          if-no-files-found: error
          retention-days: 14
